      :root {
        --red: #9b1c1c;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        min-height: 100%;
        background: #ffffff;
        color: var(--red);
        overflow-x: hidden;
        -webkit-text-size-adjust: 100%;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Fast Blaze", Impact, sans-serif;
        text-align: center;
        padding: 24px 16px;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
        width: min(1100px, 100%);
      }

      img {
        width: auto;
        height: auto;
        max-width: min(820px, 92vw);
        max-height: 62vh;
        display: block;
      }

      h1 {
        font-family: "Fast Blaze", Impact, sans-serif;
        font-weight: 400;
        font-size: 3.6vw;
        line-height: 1;
        letter-spacing: 0.01em;
        color: var(--red);
        text-transform: uppercase;
        white-space: nowrap;
        max-width: 100%;
      }

      @media (max-width: 640px) {
        body {
          padding: 16px 10px;
        }

        img {
          max-width: 96vw;
        }

        h1 {
          font-size: 3.4vw;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img
        src="octopus.gif"
        alt="Green cartoon octopus cheerfully laying bricks"
      />
      <h1>We Peaked at buying the domain</h1>
    </main>
    <script>
      function fitLine() {
        const h1 = document.querySelector("h1");
        if (!h1) return;
        h1.style.fontSize = "20px";
        const maxWidth = Math.min(window.innerWidth * 0.94, 1100);
        const size = Math.max(11, 20 * (maxWidth / h1.scrollWidth));
        h1.style.fontSize = size + "px";
      }

      document.fonts.ready.then(fitLine);
      window.addEventListener("resize", fitLine);
    </script>
  </body>
</html>
