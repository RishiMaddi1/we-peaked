<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>We Peaked at buying the domain</title>
    <style>
      @font-face {
        font-family: Bungee;
        src: url("fonts/Bungee-Regular.ttf") format("truetype");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      :root {
        --red: #e30613;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        min-height: 100%;
        background: #ffffff;
        color: var(--red);
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Bungee, sans-serif;
        text-align: center;
        padding: 32px 20px;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
        max-width: 920px;
      }

      img {
        width: min(640px, 94vw);
        height: auto;
        display: block;
      }

      h1 {
        font-family: Bungee, sans-serif;
        font-weight: 400;
        font-size: clamp(1.7rem, 5.4vw, 3.25rem);
        line-height: 1.2;
        letter-spacing: 0.04em;
        color: var(--red);
        text-transform: uppercase;
        text-wrap: balance;
      }
    </style>
  </head>
  <body>
    <main>
      <img
        src="octopus.gif"
        alt="Green cartoon octopus cheerfully laying bricks"
      />
      <h1>We Peaked at buying the domain</h1>
    </main>
  </body>
</html>
