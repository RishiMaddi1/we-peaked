<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>We Peaked at buying the domain</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bungee&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --red: #e30613;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        min-height: 100%;
        background: #ffffff;
        color: var(--red);
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Bungee, "Comic Sans MS", "Comic Sans", cursive;
        text-align: center;
        padding: 32px 20px;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
        max-width: 920px;
      }

      img {
        width: min(640px, 94vw);
        height: auto;
        display: block;
        image-rendering: auto;
      }

      h1 {
        font-family: Bungee, cursive;
        font-weight: 400;
        font-size: clamp(1.6rem, 5.2vw, 3.15rem);
        line-height: 1.22;
        letter-spacing: 0.02em;
        color: var(--red);
        text-transform: uppercase;
        text-wrap: balance;
      }
    </style>
  </head>
  <body>
    <main>
      <img
        src="octopus.gif"
        alt="Green cartoon octopus cheerfully laying bricks"
      />
      <h1>We Peaked at buying the domain</h1>
    </main>
  </body>
</html>
